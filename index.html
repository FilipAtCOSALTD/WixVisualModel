<!DOCTYPE html>
<html>
<head>
  <title>Visual Model</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background-color: #ffffff;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <model-viewer 
    src="VisualModel.glb" 
    ios-src="VisualModel.usdz" 
    alt="Visual Model" 
    auto-rotate 
    camera-controls 
    ar 
    ar-modes="scene-viewer quick-look webxr">
  </model-viewer>
</body>
</html>
